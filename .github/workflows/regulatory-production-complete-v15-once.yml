name: Complete Regulatory v1.5 One Shot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/regulatory-production-complete-v15-once.yml'
      - 'supabase/migrations/20260920180000_regulatory_v15_property_dgt_lot1.sql'
      - 'supabase/migrations/20260920213000_regulatory_v15_property_isd_rent_lot3.sql'

permissions:
  contents: read

concurrency:
  group: supabase-regulatory-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Complete audited regulatory v1.5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ybtpqscmqrrjjmuoryap

    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"

      - name: Setup validated Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link production
        shell: bash
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Verify exact partial state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/regulatory-partial"
          supabase migration list --linked 2>&1 | tee "$RUNNER_TEMP/regulatory-partial/migration-list.txt"
          test "$(grep -E '20260920163000.*20260920163000' "$RUNNER_TEMP/regulatory-partial/migration-list.txt" | wc -l)" -eq 1
          for version in 20260920180000 20260920201500 20260920213000 20260920230000; do
            grep -E "$version.*` `" "$RUNNER_TEMP/regulatory-partial/migration-list.txt" >/dev/null || {
              echo "STOP: expected pending migration not found: $version"
              exit 1
            }
          done
          supabase db push --linked --dry-run 2>&1 | tee "$RUNNER_TEMP/regulatory-partial/db-push-dry-run.txt"
          for version in 20260920180000 20260920201500 20260920213000 20260920230000; do
            grep -q "$version" "$RUNNER_TEMP/regulatory-partial/db-push-dry-run.txt"
          done

      - name: Apply remaining audited migrations
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | supabase db push --linked

      - name: Post-deploy ledger gate
        shell: bash
        run: |
          set -euo pipefail
          REGULATORY_PREFLIGHT_EVIDENCE_DIR="$RUNNER_TEMP/regulatory-postdeploy" bash scripts/regulatory-ledger-preflight.sh
          grep -qx 'ledger_state=post_regulatory_batch' "$RUNNER_TEMP/regulatory-postdeploy/ledger-summary.txt"
          grep -qx 'remote_rows=81' "$RUNNER_TEMP/regulatory-postdeploy/ledger-summary.txt"
          grep -qx 'remote_tip=20260920230000' "$RUNNER_TEMP/regulatory-postdeploy/ledger-summary.txt"
          grep -qx 'pending_count=0' "$RUNNER_TEMP/regulatory-postdeploy/ledger-summary.txt"
          grep -qx 'empty_statements=0' "$RUNNER_TEMP/regulatory-postdeploy/ledger-summary.txt"

      - name: Upload deploy evidence
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-production-completion-20260921
          path: |
            ${{ runner.temp }}/regulatory-partial/
            ${{ runner.temp }}/regulatory-postdeploy/
          if-no-files-found: error
          retention-days: 30
