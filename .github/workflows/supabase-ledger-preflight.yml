name: Supabase Ledger Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'scripts/regulatory-ledger-preflight.sh'
      - '.github/workflows/supabase-ledger-preflight.yml'
      - 'tests/infra/supabase-migration-*.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-ledger-preflight-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only ledger preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ybtpqscmqrrjjmuoryap
      REGULATORY_PREFLIGHT_EVIDENCE_DIR: ${{ runner.temp }}/supabase-ledger-preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'STOP: SUPABASE_ACCESS_TOKEN is missing'; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo 'STOP: SUPABASE_DB_PASSWORD is missing'; exit 1; }

      - name: Setup validated Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link production
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Validate production ledger and forward-only dry-run
        shell: bash
        run: bash scripts/regulatory-ledger-preflight.sh

      - name: Upload read-only preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: supabase-ledger-preflight-current
          path: ${{ runner.temp }}/supabase-ledger-preflight/
          if-no-files-found: error
          retention-days: 14
