name: Supabase Ledger Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-ledger-preflight.yml'
      - 'tests/infra/supabase-migration-*.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-ledger-preflight-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only ledger preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ybtpqscmqrrjjmuoryap
      EXPECTED_LEDGER_ROWS: "72"
      EXPECTED_FIRST_VERSION: "20260912000100"
      EXPECTED_LAST_VERSION: "20260920073758"
      EXPECTED_PENDING_COUNT: "9"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'STOP: SUPABASE_ACCESS_TOKEN is missing'; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo 'STOP: SUPABASE_DB_PASSWORD is missing'; exit 1; }

      - name: Verify baseline plus forward-only tail layout
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          test "${#files[@]}" -ge 36
          test "${files[0]}" = '20260912000100_baseline_public_primitives.sql'
          test "${files[35]}" = '20260912003600_baseline_public_acl.sql'
          versions=()
          for file in "${files[@]}"; do
            version="${file:0:14}"
            versions+=("$version")
          done
          test "$(printf '%s\n' "${versions[@]}" | sort -u | wc -l)" -eq "${#versions[@]}" || {
            echo 'STOP: duplicate local migration versions'
            exit 1
          }

      - name: Setup validated Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link production
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Validate frozen production ledger
        shell: bash
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/ledger-preflight"
          mkdir -p "$private"
          chmod 700 "$private"
          raw="$private/schema_migrations.raw.sql"

          supabase db dump \
            --linked \
            --schema supabase_migrations \
            --data-only \
            --use-copy \
            --file "$raw"
          test -s "$raw"

          mapfile -t versions < <(
            awk 'BEGIN { FS="\t" }
              /^COPY .*schema_migrations.*FROM stdin;$/ { inside=1; next }
              inside && $0 == "\\." { inside=0; next }
              inside { print $1 }
            ' "$raw" | sort
          )

          test "${#versions[@]}" -eq "$EXPECTED_LEDGER_ROWS" || {
            echo "STOP: expected $EXPECTED_LEDGER_ROWS ledger rows, got ${#versions[@]}"
            exit 1
          }
          test "${versions[0]}" = "$EXPECTED_FIRST_VERSION" || { echo 'STOP: unexpected first ledger version'; exit 1; }
          last_index=$((EXPECTED_LEDGER_ROWS - 1))
          test "${versions[$last_index]}" = "$EXPECTED_LAST_VERSION" || { echo 'STOP: unexpected production migration tip'; exit 1; }

          empty_statements="$(awk 'BEGIN { FS="\t" }
            /^COPY .*schema_migrations.*FROM stdin;$/ { inside=1; next }
            inside && $0 == "\\." { inside=0; next }
            inside && ($2 == "\\N" || $2 == "{}" || $2 == "") { empty++ }
            END { print empty+0 }
          ' "$raw")"
          test "$empty_statements" -eq 0 || { echo "STOP: $empty_statements ledger rows have empty statements"; exit 1; }

          for version in \
            20260919192850 \
            20260919192924 \
            20260920054204 \
            20260920071136 \
            20260920073758; do
            printf '%s\n' "${versions[@]}" | grep -qx "$version" || {
              echo "STOP: expected reconciled regulatory migration $version is absent remotely"
              exit 1
            }
          done

          raw_hash="$(sha256sum "$raw" | cut -d' ' -f1)"
          cat > "$private/ledger-summary.txt" <<EOF
ledger_rows=$EXPECTED_LEDGER_ROWS
first_version=$EXPECTED_FIRST_VERSION
last_version=$EXPECTED_LAST_VERSION
empty_statements=0
sha256=$raw_hash
EOF
          rm -f "$raw"

      - name: Verify migration list and dry-run
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked 2>&1 | tee "$RUNNER_TEMP/migration-list.txt"
          supabase db push --linked --dry-run 2>&1 | tee "$RUNNER_TEMP/db-push-dry-run.txt"

          mapfile -t pending < <(
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
              | sort \
              | awk '$0 >= "20260920111500_" { print substr($0,1,14) }'
          )
          test "${#pending[@]}" -eq "$EXPECTED_PENDING_COUNT" || {
            echo "STOP: expected $EXPECTED_PENDING_COUNT new regulatory migrations, got ${#pending[@]}"
            exit 1
          }

          for version in "${pending[@]}"; do
            grep -q "$version" "$RUNNER_TEMP/db-push-dry-run.txt" || {
              echo "STOP: pending migration $version missing from db push dry-run"
              exit 1
            }
          done

      - name: Upload read-only preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: supabase-ledger-preflight-current
          path: |
            ${{ runner.temp }}/ledger-preflight/ledger-summary.txt
            ${{ runner.temp }}/migration-list.txt
            ${{ runner.temp }}/db-push-dry-run.txt
          if-no-files-found: error
          retention-days: 14
