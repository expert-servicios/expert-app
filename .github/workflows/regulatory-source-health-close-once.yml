name: Regulatory Source Health Closure One Shot

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/20260921151000_regulatory_source_health_closure.sql'
      - '.github/workflows/regulatory-source-health-close-once.yml'

permissions:
  contents: read

concurrency:
  group: regulatory-source-health-closure
  cancel-in-progress: false

jobs:
  close:
    name: Deploy source-health closure and rerun audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      PROJECT_REF: ybtpqscmqrrjjmuoryap

    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Verify secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test -n "${CRON_SECRET:-}"

      - name: Setup validated Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link production
        shell: bash
        run: supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Verify exactly one pending migration
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked 2>&1 | tee /tmp/migration-list.txt
          grep -E '20260921151000.*` `' /tmp/migration-list.txt >/dev/null
          supabase db push --linked --dry-run 2>&1 | tee /tmp/db-push-dry-run.txt
          grep -q '20260921151000_regulatory_source_health_closure.sql' /tmp/db-push-dry-run.txt
          test "$(grep -c '^ • ' /tmp/db-push-dry-run.txt || true)" -eq 1

      - name: Apply source-health closure
        shell: bash
        run: |
          set -euo pipefail
          printf 'y\n' | supabase db push --linked

      - name: Verify ledger tip
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked 2>&1 | tee /tmp/migration-list-post.txt
          grep -E '20260921151000.*20260921151000' /tmp/migration-list-post.txt >/dev/null

      - name: Run full regulatory audit
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error --output /tmp/regulatory-audit.json --write-out "%{http_code}" \
            --max-time 360 \
            -X POST "https://expertconsulting.es/api/cron/regulatory-monthly-audit" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "HTTP $HTTP_CODE"
          cat /tmp/regulatory-audit.json
          test "$HTTP_CODE" = "200"
