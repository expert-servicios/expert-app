name: Regulatory Final Health Verification One Shot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/regulatory-source-initialize-once.yml'

permissions:
  contents: read

concurrency:
  group: regulatory-final-health-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify regulatory health is clean
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Verify cron secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET:-}"

      - name: Run final monthly audit
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl --silent --show-error --output /tmp/regulatory-audit.json --write-out "%{http_code}" \
            --max-time 360 \
            -X POST "https://expertconsulting.es/api/cron/regulatory-monthly-audit" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")

          echo "HTTP $HTTP_CODE"
          cat /tmp/regulatory-audit.json

          test "$HTTP_CODE" = "200"
          jq -e '.ok == true' /tmp/regulatory-audit.json >/dev/null
          jq -e '.sourceErrors == 0' /tmp/regulatory-audit.json >/dev/null
          jq -e '.health.critical == 0' /tmp/regulatory-audit.json >/dev/null
          jq -e '.health.warnings == 0' /tmp/regulatory-audit.json >/dev/null
          jq -e '.health.healthy == true' /tmp/regulatory-audit.json >/dev/null
