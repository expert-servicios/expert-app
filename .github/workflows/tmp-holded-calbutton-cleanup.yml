name: Temporary Holded CalButton cleanup

on:
  push:
    branches:
      - fix/holded-calbutton-cleanup-main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/holded-calbutton-cleanup-main
          fetch-depth: 0

      - name: Replace legacy Holded Calendly button naming
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('app/(public)/holded/pack-starter/page.tsx'),
              Path('app/(public)/holded/migracion-laboral/page.tsx'),
              Path('app/(public)/holded/migracion-sin-inventario/page.tsx'),
              Path('app/(public)/holded/migracion-con-inventario/page.tsx'),
          ]

          old_import = "import { HoldedCalendlyButton } from '@/components/holded/HoldedCalendlyButton';"
          new_import = "import { HoldedCalButton } from '@/components/holded/HoldedCalButton';"

          for path in files:
              text = path.read_text(encoding='utf-8')
              if old_import not in text:
                  raise SystemExit(f'Expected legacy import not found in {path}')
              text = text.replace(old_import, new_import)
              text = text.replace('<HoldedCalendlyButton', '<HoldedCalButton')
              text = text.replace('</HoldedCalendlyButton>', '</HoldedCalButton>')
              path.write_text(text, encoding='utf-8')
          PY

          rm components/holded/HoldedCalendlyButton.tsx

          if grep -R --line-number --fixed-strings 'HoldedCalendlyButton' app components; then
            echo 'Legacy HoldedCalendlyButton reference remains.' >&2
            exit 1
          fi

      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-holded-calbutton-cleanup.yml
          git add app components
          git commit -m 'refactor: complete Holded Cal.com button cleanup'
          git push origin HEAD:fix/holded-calbutton-cleanup-main
