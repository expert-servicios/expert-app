name: Temporary Cal.com finalizer

on:
  push:
    branches:
      - refactor/remove-calendly-completely

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-calendly-completely
          fetch-depth: 0
      - name: Finalize Cal.com-only tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/improvement-plan.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '8. ~~**Cal.com**~~ — Obsoleto: la app migro completamente a Cal.com (commits `61d9acf`, `0064245`), cero referencias a Cal.com restantes.',
              '8. ~~**Agenda legacy**~~ — ✅ Migración completada al sistema actual Cal.com (commits `61d9acf`, `0064245`), sin referencias legacy restantes.'
          )
          s = s.replace(
              '- `61d9acf`, `0064245` — migracion completa Cal.com → Cal.com (cero referencias a Cal.com restantes).',
              '- `61d9acf`, `0064245` — migración completa al sistema actual Cal.com (sin referencias legacy restantes).'
          )
          p.write_text(s, encoding='utf-8')
          PY

          git rm .github/workflows/tmp-legacy-scheduler-audit.yml .github/workflows/tmp-docs-cal-cleanup.yml

          pattern="cal""endly"
          if git grep -n -i "$pattern"; then
            echo 'Legacy scheduler reference remains.' >&2
            exit 1
          fi
          if git ls-files | grep -i "$pattern"; then
            echo 'Legacy scheduler name remains in a filename.' >&2
            exit 1
          fi

      - name: Commit final Cal.com cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: finalize Cal.com-only scheduling references'
          git push origin HEAD:refactor/remove-calendly-completely
