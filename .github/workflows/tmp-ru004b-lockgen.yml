name: Temporary RU-004b lockfile generator

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  lockfile:
    if: github.head_ref == 'feat/ru-004b-next-intl-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Generate reproducible lockfile
        run: npm install 'next-intl@^4.14.4' --save --package-lock-only

      - name: Commit generated package files when changed
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Package files already reproducible; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: add next-intl with reproducible lockfile"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload package files
        uses: actions/upload-artifact@v4
        with:
          name: ru004b-package-files
          path: |
            package.json
            package-lock.json
          retention-days: 1
