name: Temporary RU-004b lockfile generator

on:
  push:
    branches:
      - feat/ru-004b-next-intl-runtime
    paths:
      - '.github/workflows/tmp-ru004b-lockgen.yml'

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Generate reproducible lockfile
        run: npm install 'next-intl@^4.14.4' --save --package-lock-only

      - name: Upload package files
        uses: actions/upload-artifact@v4
        with:
          name: ru004b-package-files
          path: |
            package.json
            package-lock.json
          retention-days: 1
