name: KIA Dev Agent Sandbox (disabled by default)

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Exact approved task from manifest'
        type: choice
        required: true
        options:
          - E0-M3-06-DOCINDEX
      mode:
        description: 'validate is read-only; patch requires separate authorization'
        type: choice
        required: true
        default: audit
        options:
          - audit
          - validate
          - patch

permissions:
  contents: read

concurrency:
  group: kia-dev-agent-sandbox
  cancel-in-progress: false

jobs:
  validate:
    name: Validate canonical scope (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify task and checkpoint
        env:
          KIA_TASK_ID: ${{ inputs.task_id }}
        run: node scripts/kia-dev-agent.mjs audit-policy
      - name: Validate selected task ID and checkpoint (deny suspended tasks)
        if: ${{ inputs.mode == 'validate' || inputs.mode == 'patch' }}
        env:
          KIA_TASK_ID: ${{ inputs.task_id }}
        run: node scripts/kia-dev-agent.mjs validate "$KIA_TASK_ID"

  patch:
    name: Propose patch only (requires separate activation)
    needs: validate
    if: ${{ inputs.mode == 'patch' && github.ref == 'refs/heads/main' && vars.KIA_DEV_AGENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kia-dev-agent
    env:
      KIA_TASK_ID: ${{ inputs.task_id }}
      KIA_DEV_AGENT_ENABLED: ${{ vars.KIA_DEV_AGENT_ENABLED }}
      CODEX_VERSION: ${{ vars.KIA_DEV_AGENT_CODEX_VERSION }}
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require compatible exact Codex CLI version
        run: |
          node -e '
            const value = process.env.CODEX_VERSION;
            if (!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(value || "")) process.exit(1);
            const [major, minor] = value.split(".").map(Number);
            if (major === 0 && minor < 138) process.exit(1);
          '
      - name: Validate task and construct constrained prompt
        run: node scripts/kia-dev-agent.mjs prepare "$KIA_TASK_ID"
      - name: Generate candidate code in isolated workspace
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1 pinned
        with:
          openai-api-key: ${{ secrets.KIA_DEV_AGENT_OPENAI_API_KEY }}
          codex-version: ${{ env.CODEX_VERSION }}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          prompt-file: ${{ runner.temp }}/kia-dev-agent/prompt.md
          output-file: ${{ runner.temp }}/kia-dev-agent/final.txt
      - name: Create bounded untrusted patch artifact
        run: node scripts/kia-dev-agent.mjs verify "$KIA_TASK_ID"
      - name: Upload candidate patch (never push or merge)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pinned
        with:
          name: kia-candidate-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/kia-dev-agent/candidate.patch
          retention-days: 1
          if-no-files-found: error

  inspect:
    name: Validate proposed artifact without provider secrets
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KIA_TASK_ID: ${{ inputs.task_id }}
      KIA_DEV_AGENT_ENABLED: ${{ vars.KIA_DEV_AGENT_ENABLED }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 pinned
        with:
          name: kia-candidate-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/kia-dev-agent
      - name: Confirm patch scope before applying untrusted changes
        run: node scripts/kia-dev-agent.mjs inspect "$KIA_TASK_ID"
      - name: Apply vetted patch to clean temporary checkout
        env:
          KIA_PATCH_FILE: ${{ runner.temp }}/kia-dev-agent/candidate.patch
        run: git apply -- "$KIA_PATCH_FILE"
      - name: Verify exact changed file allowlist
        run: node scripts/kia-dev-agent.mjs verify "$KIA_TASK_ID"
      - name: Install dependencies without production credentials
        run: npm ci
      - name: Typecheck, lint, approved HTTP regression
        run: |
          npm run typecheck
          npm run lint
          npx vitest run tests/api/e0-company-documents-index-scope-http.test.ts
