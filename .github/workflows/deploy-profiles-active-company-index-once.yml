name: Deploy profiles active company index once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-profiles-active-company-index-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-profiles-active-company-index-once
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact profiles active-company index migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ybtpqscmqrrjjmuoryap
      EXPECTED_VERSION: 20260921212000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'STOP: SUPABASE_ACCESS_TOKEN is missing'; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo 'STOP: SUPABASE_DB_PASSWORD is missing'; exit 1; }

      - name: Setup validated Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link production
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Fail-closed dry-run
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/db-push-dry-run.txt"
          supabase db push --linked --dry-run 2>&1 | tee "$out"
          grep -q "$EXPECTED_VERSION" "$out" || { echo "STOP: expected migration $EXPECTED_VERSION is not pending"; exit 1; }
          count=$(grep -Eo '202[0-9]{11}' "$out" | sort -u | wc -l | tr -d ' ')
          test "$count" = "1" || { echo "STOP: expected exactly one pending migration, found $count"; exit 1; }

      - name: Deploy migration
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked

      - name: Verify ledger clean
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked | tee "$RUNNER_TEMP/migration-list.txt"
          grep -q "$EXPECTED_VERSION" "$RUNNER_TEMP/migration-list.txt" || { echo "STOP: expected version missing after deploy"; exit 1; }
          post="$RUNNER_TEMP/post-dry-run.txt"
          supabase db push --linked --dry-run 2>&1 | tee "$post"
          grep -Eiq 'up to date|no migrations|nothing to apply' "$post" || { echo "STOP: post-deploy dry-run still reports pending work"; exit 1; }
