name: Supabase Auth Config Audit

on:
  push:
    branches:
      - ops/supabase-auth-config-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ybtpqscmqrrjjmuoryap
    steps:
      - name: Verify token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "missing token"; exit 1; }

      - name: Read password-related auth config
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            | jq 'with_entries(select(.key | test("password|hibp|reauth"; "i")))'
