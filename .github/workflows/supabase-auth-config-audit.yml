name: Supabase Migration Name Generator

on:
  push:
    branches:
      - ops/supabase-auth-config-audit

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Generate migration filename
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/migration-name"
          cd "$RUNNER_TEMP/migration-name"
          supabase init >/dev/null
          supabase migration new drop_pgjwt_before_pg17
          find supabase/migrations -maxdepth 1 -type f -name '*_drop_pgjwt_before_pg17.sql' -printf '%f\n'
