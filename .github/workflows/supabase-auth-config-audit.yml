name: Supabase Auth Config Audit

on:
  push:
    branches:
      - ops/supabase-auth-config-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ybtpqscmqrrjjmuoryap
    steps:
      - name: Verify token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "missing token"; exit 1; }

      - name: Enable leaked password protection
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"password_hibp_enabled":true}' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            | jq '{password_hibp_enabled,password_min_length,password_required_characters}'

      - name: Verify leaked password protection
        shell: bash
        run: |
          set -euo pipefail
          value="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            | jq -r '.password_hibp_enabled')"
          test "$value" = "true"
          echo "password_hibp_enabled=true"
