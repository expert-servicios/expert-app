name: Supabase Production Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-production-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Forward-only production migration deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ybtpqscmqrrjjmuoryap

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'STOP: SUPABASE_ACCESS_TOKEN is missing'; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo 'STOP: SUPABASE_DB_PASSWORD is missing'; exit 1; }

      - name: Setup validated Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link production
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" -p "$SUPABASE_DB_PASSWORD"

      - name: Run forward-only production preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/supabase-production-migrations"
          REGULATORY_PREFLIGHT_EVIDENCE_DIR="$RUNNER_TEMP/supabase-production-migrations/preflight" \
            bash scripts/regulatory-ledger-preflight.sh

      - name: Apply pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked \
            | tee "$RUNNER_TEMP/supabase-production-migrations/migration-list-before.txt"
          supabase db push --linked --dry-run \
            | tee "$RUNNER_TEMP/supabase-production-migrations/db-push-dry-run.txt"
          supabase db push --linked \
            | tee "$RUNNER_TEMP/supabase-production-migrations/db-push.txt"

      - name: Verify production ledger after deploy
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list --linked \
            | tee "$RUNNER_TEMP/supabase-production-migrations/migration-list-after.txt"
          supabase db push --linked --dry-run \
            | tee "$RUNNER_TEMP/supabase-production-migrations/post-deploy-dry-run.txt"

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-migrations-${{ github.sha }}
          path: ${{ runner.temp }}/supabase-production-migrations/
          if-no-files-found: warn
          retention-days: 14
